name: Paper safety tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML requests
      - run: PYTHONPATH=.. python -m unittest discover -s .. -p test_paper_safety.py -v
